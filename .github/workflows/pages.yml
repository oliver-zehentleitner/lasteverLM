name: pages

# The docs site (mkdocs, from docs/) and the Keep the Why dashboard of the
# whole family (<site>/keep-the-why-dashboard/) on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the dashboard dates entries by Git history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The root and every isolated sub-project get their own export; each
      # .keep-the-why names its export in dashboard-state, which is how the
      # family resolves in public mode.
      - run: |
          pip install --quiet mkdocs-material==9.7.7 keep-the-why-dashboard
          mkdocs build --strict -d site
          ktw-dashboard --export site/keep-the-why-dashboard .
          for d in core account infra ingest rag web; do
            ktw-dashboard "$d" --export "site/keep-the-why-dashboard/$d"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
