name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists a pull request's changed files through the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      account: ${{ steps.filter.outputs.account }}
      ingest: ${{ steps.filter.outputs.ingest }}
      rag: ${{ steps.filter.outputs.rag }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A workflow change runs every job: the filters are what the workflows test.
          # Any directory's migrations run every Python job: each Postgres suite
          # applies the other directories' migrations too.
          filters: |
            core: ['core/**', '*/db/migrations/**', '.github/workflows/**']
            account: ['account/**', 'core/**', '*/db/migrations/**', '.github/workflows/**']
            ingest: ['ingest/**', 'core/**', '*/db/migrations/**', '.github/workflows/**']
            rag: ['rag/**', 'core/**', '*/db/migrations/**', '.github/workflows/**']
            web: ['web/**', '.github/workflows/**']
            infra: ['infra/**', '.github/workflows/**']

  python:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core, account, ingest, rag]
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.account == 'true' || needs.changes.outputs.ingest == 'true' || needs.changes.outputs.rag == 'true' }}
    # A disposable PostgreSQL with pgvector per matrix entry, the same major
    # version as the managed instance (18), for each directory's Postgres suite.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: skip when the directory did not change or has no Makefile yet
        id: gate
        run: |
          changed='${{ toJSON(needs.changes.outputs) }}'
          if echo "$changed" | grep -q "\"${{ matrix.service }}\": \"true\"" && [ -f "${{ matrix.service }}/Makefile" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.gate.outputs.run == 'true'
      - name: make check
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ matrix.service }}
        run: make check
      # The suites the directories' `make test-postgres` targets run against a
      # container they start themselves; here the service container replaces
      # it. Each suite reads its own variable; account's is not marked.
      - name: Postgres suite
        if: steps.gate.outputs.run == 'true' && hashFiles(format('{0}/tests/test_postgres.py', matrix.service)) != ''
        working-directory: ${{ matrix.service }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          CORE_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          INGEST_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          RAG_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: |
          if [ "${{ matrix.service }}" = account ]; then marker=(); else marker=(-m postgres); fi
          # -rs lists skips; a skipped suite fails the step, so a missing variable cannot pass silently.
          .venv/bin/pytest "${marker[@]}" -rs tests/test_postgres.py | tee pytest.log
          if grep -q "skipped" pytest.log; then echo "Postgres suite skipped tests" >&2; exit 1; fi

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make check and build
        working-directory: web
        run: |
          if [ -f Makefile ]; then make check && make build; else echo "web has no Makefile yet"; fi

  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet keep-the-why-lint black==26.10.1
      - name: make check
        working-directory: infra
        env:
          VULTR_API_KEY: validate-only
        run: make check
